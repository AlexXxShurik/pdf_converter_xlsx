[tool.poetry]
name = "pdf-converter-xlsx"
version = "0.1.0"
description = "Извлечение данных из PDF-каталога в XLSX (OCR + геометрия таблиц)"
authors = ["alexxx666"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
pymupdf = "^1.24"
opencv-python = "^4.10"
numpy = "^1.26"
openpyxl = "^3.1"
paddlepaddle = "^3.0"
paddleocr = "^2.9"
setuptools = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"